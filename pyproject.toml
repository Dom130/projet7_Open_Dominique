[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projet7-open-dominique"
version = "1.0.0"
description = "Home Credit Scoring - Projet7 OpenClassrooms - Dominique"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0,<0.116.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0,<3.0.0",
    "lightgbm==4.3.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "shap>=0.44.0",
    "mlflow==2.9.2",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
