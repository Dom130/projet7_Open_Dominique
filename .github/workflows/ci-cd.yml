name: CI/CD - Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Tests unitaires ──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov black isort flake8

      - name: Lint (black + isort + flake8)
        run: |
          black --check --line-length 100 src/ api/ tests/ || true
          isort --check-only src/ api/ tests/ || true
          flake8 src/ api/ --max-line-length 100 --ignore=E501,W503 || true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing || true

  # ─── Build Docker (optionnel, si Docker Hub configuré) ──
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile -t projet7-dominique-api:${{ github.sha }} .

      - name: Build Dashboard image
        run: docker build -f streamlit_app/Dockerfile -t projet7-dominique-dashboard:${{ github.sha }} .

      - name: Build MLflow image
        run: docker build -f mlflow/Dockerfile -t projet7-dominique-mlflow:${{ github.sha }} .
